repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-merge-conflict
    -   id: debug-statements
    -   id: end-of-file-fixer
        exclude: \.md$
    -   id: mixed-line-ending
    -   id: trailing-whitespace
        exclude: \.md$
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
    -   id: ruff-format
        exclude: \.md$
    -   id: ruff
        args: [--fix, --exit-zero]
        pass_filenames: true
        always_run: true
        verbose: true
        exclude: \.md$
